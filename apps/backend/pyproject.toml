[project]
name = "harambeeone-api"
version = "0.1.0"
description = "HarambeeOne FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "cloud-sql-python-connector[psycopg]==1.23.0",
  "email-validator==2.2.0",
  "fastapi==0.116.1",
  "firebase-admin==7.7.0",
  "google-genai==2.33.0",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "pyjwt[crypto]==2.10.1",
  "sqlalchemy==2.0.43",
  "stellar-sdk==16.1.1",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "ruff==0.12.11",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harambeeone_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
cache_dir = ".cache/pytest"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
