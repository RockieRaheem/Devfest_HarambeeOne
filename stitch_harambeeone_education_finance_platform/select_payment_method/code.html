<style>
        body { font-family: 'Public Sans', sans-serif; }
        .payment-option-radio:checked + div {
            border-color: #001736;
            background-color: #f2f3f9;
        }
        .payment-option-radio:checked + div .check-icon {
            display: block;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- TopAppBar (Transactional - Hidden Navigation Elements) -->
<header class="bg-surface w-full top-0 sticky flex justify-between items-center px-margin-mobile py-unit max-w-full z-50">
<div class="flex items-center gap-2">
<button class="p-2 text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200 ease-in-out rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<span class="font-headline-md text-headline-md font-bold text-primary">Parent Portal</span>
</div>
<div>
<!-- Suppressed trailing avatar for transactional flow, keeping empty div for flex layout -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile md:px-margin-desktop py-stack-lg max-w-[800px] w-full mx-auto pb-[100px]">
<!-- Header Section -->
<div class="mb-stack-lg text-center md:text-left">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background mb-stack-sm">Choose how to pay</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Complete your payment for Term 2 Tuition Fees.</p>
</div>
<!-- Summary Card -->
<div class="bg-surface-card border border-outline-variant rounded-xl p-stack-md mb-stack-lg flex flex-col items-center justify-center py-stack-lg shadow-sm">
<span class="font-label-sm text-label-sm text-on-surface-subtle uppercase tracking-wider mb-2">Total Amount Due</span>
<div class="flex items-baseline gap-1">
<span class="font-headline-sm text-headline-sm text-on-surface-variant align-top mt-1">$</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary">1,250.00</span>
</div>
</div>
<!-- Payment Options Form -->
<form action="#" class="space-y-stack-md" method="POST">
<!-- Mobile Money Option -->
<label class="relative block cursor-pointer group">
<input checked="" class="payment-option-radio peer sr-only" name="payment_method" type="radio" value="mobile_money"/>
<div class="border border-outline-variant rounded-xl p-stack-md flex items-center gap-stack-md transition-all duration-200 hover:bg-surface-container-lowest bg-surface-card relative overflow-hidden group-hover:border-primary-container/50">
<div class="flex-shrink-0 w-12 h-12 bg-surface-container flex items-center justify-center rounded-lg border border-outline-variant overflow-hidden">
<img class="w-8 h-8 object-contain" data-alt="A macro shot of a generic, stylized mobile phone icon with a subtle dollar sign, representing mobile payments. The background is a crisp white with a soft, diffused shadow. Lighting is studio-quality, clean and modern, fitting a high-trust institutional finance theme. The aesthetic is flat and corporate minimalism." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD3Q3eZXusylA_SuJXWYBNH8g-WymFRgS4pYi062c5_hy_7yaZOeRFLI2c12PWSW6tqubWAUtsY7Ka_jzrU-rzAi3Kb2AI0SlkyfBJqRQl5Y6H4kwH7QDpqsUffIuP_ndpEIjql99DNJ5tYxFuY4eywRltmsm6PUNtt_1pljpayLcPVLG1yLCcuOMrHwZU-zBpvrNgzg6GjtBt7TfBuqnUiGA4puR76bhorgW4B7ctjiFArxfKFuGmZuw"/>
</div>
<div class="flex-grow">
<h3 class="font-headline-sm text-headline-sm text-on-surface">Mobile Money</h3>
<p class="font-body-md text-body-md text-on-surface-variant">M-Pesa, Airtel Money, etc.</p>
</div>
<div class="flex-shrink-0">
<span class="material-symbols-outlined text-primary hidden check-icon" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="material-symbols-outlined text-outline-variant peer-checked:hidden check-icon-empty" style="font-variation-settings: 'FILL' 0;">radio_button_unchecked</span>
</div>
</div>
</label>
<!-- Credit/Debit Card Option -->
<label class="relative block cursor-pointer group">
<input class="payment-option-radio peer sr-only" name="payment_method" type="radio" value="card"/>
<div class="border border-outline-variant rounded-xl p-stack-md flex items-center gap-stack-md transition-all duration-200 hover:bg-surface-container-lowest bg-surface-card relative overflow-hidden group-hover:border-primary-container/50">
<div class="flex-shrink-0 w-12 h-12 bg-surface-container flex items-center justify-center rounded-lg border border-outline-variant overflow-hidden">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">credit_card</span>
</div>
<div class="flex-grow">
<h3 class="font-headline-sm text-headline-sm text-on-surface">Credit / Debit Card</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Visa, Mastercard, AMEX</p>
</div>
<div class="flex-shrink-0">
<span class="material-symbols-outlined text-primary hidden check-icon" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="material-symbols-outlined text-outline-variant peer-checked:hidden check-icon-empty" style="font-variation-settings: 'FILL' 0;">radio_button_unchecked</span>
</div>
</div>
</label>
<!-- Bank Transfer Option -->
<label class="relative block cursor-pointer group">
<input class="payment-option-radio peer sr-only" name="payment_method" type="radio" value="bank_transfer"/>
<div class="border border-outline-variant rounded-xl p-stack-md flex items-center gap-stack-md transition-all duration-200 hover:bg-surface-container-lowest bg-surface-card relative overflow-hidden group-hover:border-primary-container/50">
<div class="flex-shrink-0 w-12 h-12 bg-surface-container flex items-center justify-center rounded-lg border border-outline-variant overflow-hidden">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">account_balance</span>
</div>
<div class="flex-grow">
<h3 class="font-headline-sm text-headline-sm text-on-surface">Bank Transfer</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Direct EFT from your bank</p>
</div>
<div class="flex-shrink-0">
<span class="material-symbols-outlined text-primary hidden check-icon" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="material-symbols-outlined text-outline-variant peer-checked:hidden check-icon-empty" style="font-variation-settings: 'FILL' 0;">radio_button_unchecked</span>
</div>
</div>
</label>
<!-- Action Area -->
<div class="mt-stack-lg pt-stack-md border-t border-outline-variant flex flex-col md:flex-row-reverse gap-stack-md items-center justify-between">
<button class="w-full md:w-auto bg-primary text-on-primary min-h-[48px] px-6 rounded-lg font-label-sm text-label-sm flex items-center justify-center gap-2 hover:bg-primary-container transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="submit">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">lock</span>
                    Pay Now
                </button>
<a class="w-full md:w-auto text-center font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors py-2" href="#">
                    Cancel
                </a>
</div>
<div class="text-center mt-4 flex items-center justify-center gap-1 text-on-surface-subtle font-body-md text-body-md text-xs">
<span class="material-symbols-outlined text-[14px]">shield</span>
                Payments are securely processed.
            </div>
</form>
</main>
<!-- Navigation Shell (BottomNavBar or SideNav) SUPPRESSED for Transactional Screen per instructions -->
</body></html>
