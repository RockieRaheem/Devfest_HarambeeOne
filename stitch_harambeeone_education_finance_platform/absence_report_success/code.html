<body class="bg-background text-on-background font-body-md h-screen flex flex-col antialiased">
<!-- Header (Suppressed topbar standard nav, using focused header) -->
<header class="bg-surface fixed top-0 w-full z-50 flex items-center px-margin-mobile h-14 border-b border-outline-variant">
<button class="material-symbols-outlined text-primary hover:bg-surface-container-low transition-colors rounded-full p-2 active:scale-95 transition-transform" data-icon="arrow_back">arrow_back</button>
<h1 class="font-headline-sm text-headline-sm text-primary font-bold ml-4">Report Submitted</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto pt-[80px] pb-safe px-margin-mobile flex flex-col items-center">
<!-- Success Visual -->
<div class="mt-stack-lg flex flex-col items-center text-center max-w-md w-full">
<div class="w-24 h-24 bg-status-success/10 rounded-full flex items-center justify-center mb-stack-md">
<span class="material-symbols-outlined text-status-success" style="font-size: 48px; font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-stack-sm">Absence Reported Successfully</h2>
<p class="font-body-lg text-body-lg text-on-surface-subtle mb-stack-lg">The school has been notified and Jamal's attendance record will be updated shortly.</p>
</div>
<!-- Summary Card (Glassmorphism/Minimal) -->
<div class="w-full max-w-md bg-surface-card border border-outline-variant rounded-xl p-6 shadow-[0_4px_12px_rgba(0,23,54,0.04)] mb-stack-lg">
<h3 class="font-headline-sm text-headline-sm text-primary mb-stack-md">Submission Details</h3>
<div class="space-y-4">
<div class="flex justify-between items-start border-b border-surface-variant pb-3">
<span class="font-label-sm text-label-sm text-on-surface-subtle uppercase tracking-wider">Student Name</span>
<span class="font-body-md text-body-md text-on-surface font-semibold">Jamal Smith</span>
</div>
<div class="flex justify-between items-start border-b border-surface-variant pb-3">
<span class="font-label-sm text-label-sm text-on-surface-subtle uppercase tracking-wider">Dates</span>
<span class="font-body-md text-body-md text-on-surface text-right">Oct 24 - Oct 25, 2023</span>
</div>
<div class="flex justify-between items-start">
<span class="font-label-sm text-label-sm text-on-surface-subtle uppercase tracking-wider">Reason</span>
<span class="font-body-md text-body-md text-on-surface">Illness</span>
</div>
</div>
</div>
<!-- Actions -->
<div class="w-full max-w-md flex flex-col gap-unit mt-auto pb-stack-lg">
<button class="w-full bg-primary text-on-primary h-12 rounded-lg font-headline-sm text-headline-sm flex items-center justify-center hover:bg-primary-container transition-colors active:scale-95 shadow-[0_2px_8px_rgba(0,23,54,0.12)]">

<button class="w-full bg-transparent text-primary h-12 rounded-lg font-body-md text-body-md font-semibold flex items-center justify-center hover:bg-surface-container-low transition-colors active:scale-95 border border-transparent hover:border-outline-variant">
